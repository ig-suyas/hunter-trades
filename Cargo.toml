[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "UNLICENSED"
publish = false

# Shared third-party versions go here as phases add them. Keep the set lean
# (12 GB RAM laptop): prefer small crates, no async runtime until cs-live needs one.
[workspace.dependencies]
cs-core = { path = "crates/cs-core" }
cs-data = { path = "crates/cs-data" }
cs-patterns = { path = "crates/cs-patterns" }
cs-stats = { path = "crates/cs-stats" }
cs-backtest = { path = "crates/cs-backtest" }
# Phase 1 (see handoff section 4 for why each one): blocking HTTP and WebSocket clients on the
# Windows-native TLS stack (SChannel), so no async runtime and no C crypto build.
ureq = { version = "3.5", default-features = false, features = ["native-tls"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "native-tls"] }
native-tls = "0.2"
sha2 = "0.11"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
serde_json = "1"
cs-live = { path = "crates/cs-live" }
# Phase 5 (dev only): per-candle latency benchmark; plots and rayon off to keep the tree small.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Phase 6 overlay (handoff section 3 says why): egui/eframe on the OpenGL (glow) backend instead
# of the default wgpu one (far fewer crates, no DirectX/Vulkan shader stack), and global hotkeys.
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit", "clipboard"] }
global-hotkey = "0.10"
# Local UTC offset for the panel clock (std has no time-zone access).
time = { version = "0.3", default-features = false, features = ["std", "local-offset"] }
# Phase 7 screen awareness (handoff section 3 says why): capture of one window (safe API over GDI
# PrintWindow) and the offline Windows OCR engine. Both reuse the windows 0.62 crate that eframe's
# accessibility layer already brings in.
cs-vision = { path = "crates/cs-vision" }
xcap = { version = "0.9", default-features = false }
windows = { version = "0.62", default-features = false, features = [
    "std",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# OHLC and calendar code reads best with o/h/l/c and y/m/d names.
many_single_char_names = "allow"
must_use_candidate = "allow"
float_cmp = "deny"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
print_stdout = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
debug = "line-tables-only"
