[package]
name = "cs-ui"
description = "Always-on-top overlay: alerts of the 10 frozen rules (all failed testing) with their past results, market context in Details; never orders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cs-core.workspace = true
cs-live.workspace = true
# The Phase 3 cost model (`cost::CostModel`) for the round-trip cost estimate in Details.
cs-backtest.workspace = true
cs-data.workspace = true
cs-patterns.workspace = true
# Phase 7: screen awareness (symbol, time frame and price check from the platform window).
cs-vision.workspace = true
eframe.workspace = true
global-hotkey.workspace = true
time.workspace = true
serde_json.workspace = true
# PNG screenshots: zlib stream and CRC-32 (already in the tree).
flate2.workspace = true

[[bin]]
name = "candlescope-overlay"
path = "src/main.rs"

# Phase 7 check tool: the screen reading without the panel, one line per second.
[[bin]]
name = "vision-watch"
path = "src/bin/vision_watch.rs"
